name: Préparer la mise à jour E-Strips

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  paquet:
    if: ${{ !github.event.release.prerelease && !contains(github.event.release.assets.*.name, 'E-Strips-Update.json') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Générer le paquet
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node fabriquer-mise-a-jour.mjs "$RELEASE_TAG"
      - name: Joindre le paquet
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" E-Strips-Update.json --repo "$GITHUB_REPOSITORY"
